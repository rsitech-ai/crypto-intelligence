[workspace]
resolver = "2"
exclude = ["vendor/libsqlite3-sys"]
members = [
  "apps/connector-certify",
  "apps/crypto-evaluate",
  "apps/cryptoriskd",
  "crates/capacity",
  "crates/connector-binance",
  "crates/connector-bybit",
  "crates/connector-core",
  "crates/connector-kraken",
  "crates/config",
  "crates/domain",
  "crates/event-envelope",
  "crates/fixed-decimal",
  "crates/instrument-registry",
  "crates/local-api",
  "crates/metadata-store",
  "crates/observability",
  "crates/orderbook",
  "crates/parquet-store",
  "crates/raw-wal",
  "crates/system-tests",
  "xtask",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Rafal Sikora <s1korrrr@users.noreply.github.com>"]
repository = "https://github.com/s1korrrr/crypto-inteligence"
publish = false
[workspace.dependencies]
anyhow = "1"
arrow = { version = "=59.1.0", default-features = false }
arrow-schema = { version = "=59.1.0", default-features = false, features = ["serde"] }
async-trait = "0.1"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
proptest = "1"
parquet = { version = "=59.1.0", default-features = false, features = ["arrow", "zstd"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "backup"] }
rustix = { version = "1", features = ["fs", "process"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "=0.3.54", default-features = false, features = ["std"] }
tokio = { version = "~1.51.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
