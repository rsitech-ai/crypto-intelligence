[workspace]
resolver = "2"
members = [
  "crates/config",
  "crates/domain",
  "crates/event-envelope",
  "crates/fixed-decimal",
  "crates/system-tests",
  "xtask",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Rafal Sikora <s1korrrr@users.noreply.github.com>"]
repository = "https://github.com/s1korrrr/crypto-inteligence"
publish = false
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
futures = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
prost = "0.13"
proptest = "1"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.51", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = "0.12"
tonic-health = "0.12"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
