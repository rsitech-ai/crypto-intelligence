syntax = "proto3";

package cmti.health.v1;

import "common/v1/common.proto";

// Minimal unauthenticated serving state.
enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
}

// Empty by design: liveness never accepts or reflects private runtime state.
message CheckRequest {}

// Unauthenticated liveness contains only serving state and protocol version.
message CheckResponse {
  ServingStatus status = 1;
  cmti.common.v1.ProtocolVersion protocol = 2;
}

// Minimal unauthenticated liveness for process supervision.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}
