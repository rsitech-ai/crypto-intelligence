syntax = "proto3";

package cmti.market.v1;

// Health of the authoritative market snapshot.
enum SnapshotHealth {
  SNAPSHOT_HEALTH_UNSPECIFIED = 0;
  SNAPSHOT_HEALTH_HEALTHY = 1;
  SNAPSHOT_HEALTH_DEGRADED = 2;
  SNAPSHOT_HEALTH_STALE = 3;
  SNAPSHOT_HEALTH_UNAVAILABLE = 4;
}

// Empty by design: the first slice exposes one authoritative configured market.
message GetSnapshotRequest {}

// Immutable authoritative snapshot. Monetary fields are canonical decimals.
message GetSnapshotResponse {
  string source = 1;
  string symbol = 2;
  uint32 generation = 3;
  uint64 sequence = 4;
  string best_bid = 5;
  string best_ask = 6;
  SnapshotHealth health = 7;
  sint64 event_unix_nanos = 8;
  sint64 receive_unix_nanos = 9;
  uint64 freshness_millis = 10;
}

// Authenticated local access to the authoritative market snapshot.
service MarketService {
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
}
