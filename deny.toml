[graph]
all-features = true
[advisories]
version = 2
yanked = "deny"
ignore = []
[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL", "MPL-2.0", "BSL-1.0", "CC0-1.0"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "cpufeatures@0.2.17", reason = "sha2 remains on cpufeatures 0.2 while blake3 uses 0.3" },
  { crate = "foldhash@0.1.5", reason = "prost-build and bundled SQLite use different hashbrown generations" },
  { crate = "getrandom@0.2.17", reason = "rand 0.8 and tempfile require different supported getrandom generations" },
  { crate = "hashbrown@0.15.5", reason = "prost-build dependency generation" },
  { crate = "hashbrown@0.16.1", reason = "bundled SQLite WASM build dependency generation" },
  { crate = "syn@2.0.119", reason = "tonic build dependencies and current derive crates use different supported syn generations" },
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
